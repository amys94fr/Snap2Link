name: Winget

# Releases are created as drafts, so winget only hears about a version once
# the maintainer publishes it. A release published with GITHUB_TOKEN wouldn't
# start this workflow; publishing by hand does.
on:
  release:
    types: [published]
  # Retry from a tag: the `release` environment only accepts v* refs.
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned tool, verified by SHA256 before it runs. Bump both lines together.
  WINGETCREATE_URL: https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe
  WINGETCREATE_SHA256: 24042bd37915805615e6cf969ac57c6439124c3fe85823327f5f3fb24bd9ffea

jobs:
  submit:
    name: Submit winget update PR
    runs-on: windows-latest
    environment: release
    if: ${{ vars.SUBMIT_WINGET == 'true' && !github.event.release.prerelease }}
    steps:
      - name: Resolve version
        id: v
        shell: pwsh
        env:
          RAW_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          if ($env:RAW_TAG -cnotmatch '\Av[0-9]+\.[0-9]+\.[0-9]+\z') {
            throw "Tag must look like v1.2.3"
          }
          "tag=$env:RAW_TAG" >> $env:GITHUB_OUTPUT
          "version=$($env:RAW_TAG.Substring(1))" >> $env:GITHUB_OUTPUT

      - name: Install wingetcreate (pinned, checksum-verified)
        shell: pwsh
        run: |
          # wingetcreate 1.12.x prints both the version line and the
          # full help, then exits 1, so neither `version` nor `--version`
          # can be used as a self-test. The checksum is the real gate.
          Invoke-WebRequest -Uri $env:WINGETCREATE_URL -OutFile wingetcreate.exe
          $hash = (Get-FileHash wingetcreate.exe -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:WINGETCREATE_SHA256) {
            throw "wingetcreate.exe checksum mismatch: $hash"
          }

      - name: Submit update to microsoft/winget-pkgs
        shell: pwsh
        env:
          WINGET_PAT: ${{ secrets.WINGET_PAT }}
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if (-not $env:WINGET_PAT) {
            throw "Missing secret WINGET_PAT."
          }
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG/Snap2Link_$($env:VERSION)_x64-setup.exe"
          .\wingetcreate.exe update amys94fr.Snap2Link `
            --version "$env:VERSION" `
            --urls "$url" `
            --submit `
            --token "$env:WINGET_PAT"
