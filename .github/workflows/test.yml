name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          check-latest: true
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Unit + component tests
        run: pnpm test

      - name: Dependency audit
        run: pnpm audit --audit-level high

  backend:
    name: Backend (cargo test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          check-latest: true
          cache: "pnpm"

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Install pnpm deps
        run: pnpm install --frozen-lockfile

      # Tauri's `generate_context!` macro reads the frontendDist path at
      # compile time, so we need a dist/ so the macro doesn't error before
      # we run the actual build.
      - name: Build frontend (so dist/ exists for tauri context)
        run: pnpm build

      # credentials.json is embedded with include_str! at compile time.
      # The unit tests don't actually use it, so a placeholder works fine
      # and avoids needing the real Google secret on PR runs from forks.
      - name: Stub credentials.json
        shell: pwsh
        run: |
          @'
          {"installed":{"client_id":"stub","project_id":"stub","auth_uri":"https://accounts.google.com/o/oauth2/auth","token_uri":"https://oauth2.googleapis.com/token","client_secret":"stub","redirect_uris":["http://localhost"]}}
          '@ | Set-Content credentials.json -Encoding UTF8 -NoNewline

      - name: Cargo test --lib
        working-directory: src-tauri
        run: cargo test --lib
