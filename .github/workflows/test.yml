name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit + component tests
        run: npm test

  backend:
    name: Backend (cargo test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri's `generate_context!` macro reads the frontendDist path at
      # compile time, so we need a stub `dist/` so the macro doesn't error
      # before we run the actual build.
      - name: Install npm deps
        run: npm ci

      - name: Build frontend (so dist/ exists for tauri context)
        run: npm run build

      - name: Cargo test --lib
        working-directory: src-tauri
        run: cargo test --lib --no-default-features
