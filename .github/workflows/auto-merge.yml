name: Auto-merge

# Auto-merge Dependabot PRs as soon as the Tests workflow goes green.
#
# Decision matrix:
#   patch / minor (npm, cargo)     -> queued for auto-merge; the `main`
#                                     ruleset holds it until the Tests
#                                     workflow is green
#   github-actions (any bump)      -> NO auto-merge: an action runs with the
#                                     release secrets, so a human reviews it
#   major (any ecosystem)          -> NO auto-merge, wait for review. Majors
#                                     are where breaking changes live (we hit
#                                     this with Tailwind 4 and TS 6).
#
# Non-Dependabot PRs are ignored entirely; they always need human review.
# The check is on the PR author, not `github.actor`, which can be whoever
# re-ran the workflow.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot-auto-merge:
    name: Squash-merge if patch/minor + CI green
    runs-on: ubuntu-24.04
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch/minor
        if: |
          steps.metadata.outputs.package-ecosystem != 'github_actions' && (
            steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
            steps.metadata.outputs.update-type == 'version-update:semver-minor'
          )
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # `gh pr merge --auto` queues the merge — GitHub fires it the moment
          # all required checks (Tests workflow) report success.
          gh pr merge "$PR_URL" --auto --squash --delete-branch

      - name: Comment on majors so the maintainer knows it's queued for review
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PKG: ${{ steps.metadata.outputs.dependency-names }}
        run: |
          gh pr comment "$PR_URL" --body "🚧 Major version bump for \`$PKG\` detected. Auto-merge is **disabled** for majors — waiting for human or Claude review. CI will still run and the merge button will be enabled once it's green."
