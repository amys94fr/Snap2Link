name: Relay

on:
  push:
    branches: [main]
    paths: ["relay/**", ".github/workflows/relay.yml"]
  pull_request:
    branches: [main]
    paths: ["relay/**", ".github/workflows/relay.yml"]

permissions:
  contents: read

jobs:
  test:
    name: Relay (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          package_json_file: relay/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          check-latest: true
          cache: "pnpm"
          cache-dependency-path: relay/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Dependency audit
        run: pnpm audit --audit-level high

  deploy:
    name: Deploy
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: relay
    concurrency:
      group: relay-deploy
      cancel-in-progress: false
    defaults:
      run:
        working-directory: relay
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          package_json_file: relay/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          check-latest: true
          cache: "pnpm"
          cache-dependency-path: relay/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm exec wrangler d1 migrations apply snap2link-relay --remote

      - name: Deploy
        run: pnpm exec wrangler deploy
