name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.1) — must already exist."
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, sign and release
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      tag: ${{ steps.version.outputs.TAG }}
      installer_url: ${{ steps.urls.outputs.INSTALLER_URL }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $version = $tag.TrimStart('v')
          "VERSION=$version" | Out-File $env:GITHUB_OUTPUT -Append
          "TAG=$tag" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "Tag: $tag, Version: $version"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm ci

      - name: Restore credentials.json from secret
        shell: pwsh
        env:
          CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          if (-not $env:CREDENTIALS_JSON) {
            throw "Missing secret GOOGLE_CREDENTIALS_JSON."
          }
          $env:CREDENTIALS_JSON | Set-Content -Path credentials.json -Encoding UTF8 -NoNewline
          Write-Host "credentials.json restored ($($env:CREDENTIALS_JSON.Length) chars)"

      - name: Run frontend tests
        run: npm test

      # Tauri's `generate_context!` macro reads frontendDist (../dist) at
      # compile time, so the cargo test invocation needs an existing dist/.
      # We do a real build here; `npm run tauri build` later reuses it.
      - name: Build frontend (so dist/ exists for the tauri context macro)
        run: npm run build

      - name: Run backend tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Build signed Tauri bundle
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "Missing secret TAURI_SIGNING_PRIVATE_KEY."
          }
          # Strip BOM, whitespace and stray quotes that may have leaked in
          # while the secret was being set (`gh secret set --body -` over a
          # PowerShell pipe is a common offender on Windows).
          $key = $env:TAURI_SIGNING_PRIVATE_KEY
          $key = $key.Trim()
          $key = $key.Trim([char]0xFEFF)
          $key = $key.Trim('"', "'")
          $key = $key -replace "[`r`n`t ]", ""
          $env:TAURI_SIGNING_PRIVATE_KEY = $key
          # Log only the length and the first/last char codes so we can
          # diagnose corruption without leaking the key.
          Write-Host "Sanitised key: length=$($key.Length), first=$([int]$key[0]), last=$([int]$key[-1])"
          npm run tauri build

      - name: Compute installer URL
        id: urls
        shell: pwsh
        run: |
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.TAG }}/Snap2Link_${{ steps.version.outputs.VERSION }}_x64-setup.exe"
          "INSTALLER_URL=$url" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host $url

      - name: Generate latest.json
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $notes = "Automated release ${{ steps.version.outputs.TAG }}. See the release description for details."
          .\scripts\make_latest_json.ps1 -Version $version -Notes $notes

      - name: Generate release body
        shell: pwsh
        run: |
          .\scripts\make_release_body.ps1 -Tag "${{ steps.version.outputs.TAG }}" -Repo "${{ github.repository }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: Snap2Link ${{ steps.version.outputs.TAG }}
          body_path: scripts/release-out/release-body.md
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/bundle/nsis/Snap2Link_${{ steps.version.outputs.VERSION }}_x64-setup.exe
            src-tauri/target/release/bundle/nsis/Snap2Link_${{ steps.version.outputs.VERSION }}_x64-setup.exe.sig
            scripts/release-out/latest.json

  submit-winget:
    name: Submit winget update PR
    needs: build-and-release
    runs-on: windows-latest
    if: ${{ vars.SUBMIT_WINGET == 'true' }}
    steps:
      - name: Install wingetcreate
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe --version

      - name: Submit update to microsoft/winget-pkgs
        shell: pwsh
        env:
          WINGET_PAT: ${{ secrets.WINGET_PAT }}
        run: |
          if (-not $env:WINGET_PAT) {
            throw "Missing secret WINGET_PAT."
          }
          .\wingetcreate.exe update amys94fr.Snap2Link `
            --version "${{ needs.build-and-release.outputs.version }}" `
            --urls "${{ needs.build-and-release.outputs.installer_url }}" `
            --submit `
            --token "$env:WINGET_PAT"
