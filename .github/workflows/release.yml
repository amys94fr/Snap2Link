name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.1.0) — must already exist."
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: darwin-universal
            os: macos-14
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Linux system dependencies
        if: matrix.platform.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libsoup-3.0-dev \
            libpipewire-0.3-dev \
            libxdo-dev \
            libgbm-dev \
            libegl-dev \
            libwayland-dev \
            libxcb1-dev \
            libxcb-shm0-dev \
            libdrm-dev \
            patchelf

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - uses: dtolnay/rust-toolchain@stable
        with:
          # universal-apple-darwin is a Tauri meta-target that lipos
          # aarch64 + x86_64 builds; we install the two real targets
          # explicitly when the matrix entry asks for it.
          targets: ${{ matrix.platform.rust_targets || matrix.platform.target }}

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend (so dist/ exists for the tauri context macro)
        run: pnpm build

      - name: Restore credentials.json from secret
        shell: bash
        env:
          CREDS: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          if [ -z "$CREDS" ]; then
            echo "Missing secret GOOGLE_CREDENTIALS_JSON" >&2
            exit 1
          fi
          printf '%s' "$CREDS" > credentials.json
          echo "credentials.json restored ($(printf '%s' "$CREDS" | wc -c) bytes)"

      - name: Run frontend tests
        run: pnpm test

      - name: Run backend tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Build signed Tauri bundle
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          # Sanitise the key in case the secret carries a stray BOM/whitespace
          # (we hit that exact bug earlier — see release.yml history).
          KEY=$(printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | tr -d '\r\n\t "'"'"'' | sed 's/^\xEF\xBB\xBF//')
          export TAURI_SIGNING_PRIVATE_KEY="$KEY"
          echo "Sanitised key length: ${#KEY}"
          pnpm tauri build -- --target ${{ matrix.platform.target }}

      - name: Upload bundle artefacts
        uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.platform.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/nsis/*
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/dmg/*
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/macos/*
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/appimage/*
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/deb/*
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/rpm/*
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Resolve version from tag
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tag: $TAG, Version: $VERSION"

      - name: Download all build artefacts
        uses: actions/download-artifact@v8
        with:
          path: artefacts

      - name: Show what was downloaded
        run: find artefacts -maxdepth 4 -type f | sort

      - name: Generate latest.json
        run: |
          node scripts/make_latest_json.mjs \
            --version "${{ steps.version.outputs.VERSION }}" \
            --notes "Automated release ${{ steps.version.outputs.TAG }}. See the release description for details."

      - name: Generate release body from CHANGELOG
        run: |
          node scripts/make_release_body.mjs \
            --tag "${{ steps.version.outputs.TAG }}" \
            --repo "${{ github.repository }}"

      - name: Flatten artefacts for the release
        run: |
          mkdir -p release-files
          find artefacts -type f \( \
            -name "*.exe" -o -name "*.exe.sig" -o \
            -name "*.dmg" -o \
            -name "*.app.tar.gz" -o -name "*.app.tar.gz.sig" -o \
            -name "*.AppImage" -o -name "*.AppImage.tar.gz" -o -name "*.AppImage.tar.gz.sig" -o \
            -name "*.deb" -o \
            -name "*.rpm" \
          \) -exec cp {} release-files/ \;
          cp scripts/release-out/latest.json release-files/
          ls -lh release-files/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: Snap2Link ${{ steps.version.outputs.TAG }}
          body_path: scripts/release-out/release-body.md
          fail_on_unmatched_files: true
          files: release-files/*

  submit-winget:
    name: Submit winget update PR
    needs: release
    runs-on: windows-latest
    if: ${{ vars.SUBMIT_WINGET == 'true' }}
    steps:
      - name: Resolve version
        id: version
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "VERSION=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Install wingetcreate
        shell: pwsh
        run: |
          # wingetcreate 1.12.x prints both the version line and the
          # full help, then exits 1, so neither `version` nor `--version`
          # can be used as a self-test. We just download the binary; the
          # real validation is the `update` call in the next step.
          Invoke-WebRequest -Uri https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe

      - name: Submit update to microsoft/winget-pkgs
        shell: pwsh
        env:
          WINGET_PAT: ${{ secrets.WINGET_PAT }}
        run: |
          if (-not $env:WINGET_PAT) {
            throw "Missing secret WINGET_PAT."
          }
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.TAG }}/Snap2Link_${{ steps.version.outputs.VERSION }}_x64-setup.exe"
          .\wingetcreate.exe update amys94fr.Snap2Link `
            --version "${{ steps.version.outputs.VERSION }}" `
            --urls "$url" `
            --submit `
            --token "$env:WINGET_PAT"
